name: Compile MCM Android SDK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle Build Environment
      uses: gradle/actions/setup-gradle@v3

    - name: Build the AAR Library
      run: gradle :mcm-sdk:assembleRelease

    - name: Upload Library Artifact
      uses: actions/upload-artifact@v3
      with:
        name: mcm-sdk-release-aar
        path: mcm-sdk/build/outputs/aar/
